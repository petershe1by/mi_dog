/**:
  ros__parameters:
    camera_topic: "/mi_desktop_48_b0_2d_7a_fe_40/image"
    lidar_topic: "/mi_desktop_48_b0_2d_7a_fe_40/scan"
    odometry_topic: "/mi_desktop_48_b0_2d_7a_fe_40/odom_out"
    current_stage_topic: "/mi_dog_real/supervisor/current_stage"
    observation_topic: "/mi_dog_real/course_observation"
    status_topic: "/mi_dog_real/course_perception/status"
