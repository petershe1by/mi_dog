/**:
  ros__parameters:
    # Official drawing geometry is loaded below, but randomized object poses,
    # the start transform and physical stage results still require site work.
    # Keep this false until every stage and one full run have passed.
    course_calibrated: false
    geometry_source: "official_2026_problem_pdf_page_3"
    camera_topic: "/mi_desktop_48_b0_2d_7a_fe_40/image"
