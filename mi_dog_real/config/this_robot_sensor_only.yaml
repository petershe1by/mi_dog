/**:
  ros__parameters:
    # CyberDog 2 mi-desktop 48:b0:2d:7a:fe:40, observed 2026-08-05.
    # This profile cannot publish motion even if command topics receive data.
    enable_motion: false
    arm_token: ""
    require_sensor_ready: true
    require_camera_ready: false
    require_lidar_ready: true
    require_pose_ready: true
    require_estop_ready: true
    require_voice_start: true
    require_supervisor_run_allowed: true
    supervisor_timeout_sec: 0.5

    camera_topic: "/mi_desktop_48_b0_2d_7a_fe_40/image"
    lidar_topic: "/mi_desktop_48_b0_2d_7a_fe_40/scan"
    pose_topic: "/mi_desktop_48_b0_2d_7a_fe_40/pose_filtered"
    odometry_topic: "/mi_desktop_48_b0_2d_7a_fe_40/odom_out"
    motion_topic: "/mi_desktop_48_b0_2d_7a_fe_40/motion_servo_cmd"
    estop_topic: "/mi_dog_real/emergency_stop"
    command_topic: "/mi_dog_real/safe_cmd_vel"
    voice_command_topic: "/mi_desktop_48_b0_2d_7a_fe_40/asr_text"
    touch_topic: "/mi_desktop_48_b0_2d_7a_fe_40/touch_status"
    race_enabled_topic: "/mi_dog_real/race_enabled"
    operator_event_topic: "/mi_dog_real/operator_event"
    supervisor_run_allowed_topic: "/mi_dog_real/supervisor/run_allowed"
    audio_feedback_service: "/mi_desktop_48_b0_2d_7a_fe_40/speech_text_play"
    wake_event_topic: "/mi_desktop_48_b0_2d_7a_fe_40/dog_wakeup"
    continue_dialog_topic: "/mi_desktop_48_b0_2d_7a_fe_40/continue_dialog"
    # Disabled after the 2026-08-10 offline test: opening the stock dialogue
    # path also allowed the factory assistant to execute a posture command.
    # Do not re-enable until custom ASR is isolated from factory actions.
    manage_dialogue: false
    wake_word_topic: "/mi_desktop_48_b0_2d_7a_fe_40/wake_word"
    wake_word: "铁蛋铁蛋"
    publish_wake_word: false
    start_phrase: "启动"
    continue_phrase: "恢复"
    pause_phrase: "暂停"
    stop_phrase: "终止"
    touch_pause_enabled: true
    # Verified on this robot: firmware reports state 3 for a hardware-recognized
    # double tap, sometimes as several duplicate messages for one gesture.
    touch_double_tap_state: 3
    touch_lockout_sec: 1.5
    audio_feedback_enabled: true
    audio_feedback_play_id: 9000

    sensor_timeout_sec: 1.0
    estop_timeout_sec: 0.50
    command_timeout_sec: 0.30
    publish_rate_hz: 10.0
    stop_heartbeat_sec: 0.20

    max_forward_mps: 0.25
    max_lateral_mps: 0.10
    max_yaw_rps: 0.40
    max_forward_accel_mps2: 0.40
    max_lateral_accel_mps2: 0.30
    max_yaw_accel_rps2: 0.80
    front_stop_distance_m: 0.35
    front_slow_distance_m: 0.70
    front_half_angle_rad: 0.45
    max_tilt_rad: 0.60
    step_height_m: 0.05
