/**:
  ros__parameters:
    # Deliberately false in the repository.  Set true only after the connection,
    # topic mapping, standing posture and emergency-stop procedure are verified.
    enable_motion: false
    arm_token: ""
    require_sensor_ready: true
    require_camera_ready: false
    require_lidar_ready: true
    require_pose_ready: true
    require_estop_ready: true
    # Competition motion remains stopped until an exact recognized phrase arrives.
    require_voice_start: true
    # Fail closed unless the independent race supervisor continuously permits motion.
    require_supervisor_run_allowed: true
    supervisor_timeout_sec: 0.5

    # These are the documented CyberDog 2 defaults; inspect `ros2 topic list`
    # on the robot and remap them if its software release differs.
    camera_topic: "/image"
    lidar_topic: "/scan"
    pose_topic: "/pose_filtered"
    estop_topic: "/mi_dog_real/emergency_stop"
    motion_topic: "/motion_servo_cmd"
    command_topic: "/mi_dog_real/safe_cmd_vel"
    # Map the robot's verified ASR text output into this String topic.
    voice_command_topic: "/mi_dog_real/voice_command"
    touch_topic: "/touch_status"
    race_enabled_topic: "/mi_dog_real/race_enabled"
    operator_event_topic: "/mi_dog_real/operator_event"
    supervisor_run_allowed_topic: "/mi_dog_real/supervisor/run_allowed"
    audio_feedback_service: "/speech_text_play"
    wake_event_topic: "/dog_wakeup"
    continue_dialog_topic: "/continue_dialog"
    manage_dialogue: true
    wake_word_topic: "wake_word"
    wake_word: "铁蛋铁蛋"
    # Keep false for the stock default. Enable only to deliberately change it.
    publish_wake_word: false
    start_phrase: "启动"
    continue_phrase: "恢复"
    pause_phrase: "暂停"
    stop_phrase: "终止"
    touch_pause_enabled: true
    touch_double_tap_state: 3
    touch_lockout_sec: 1.5
    audio_feedback_enabled: true
    # Offline built-in ready sound; avoids depending on cloud TTS during competition.
    audio_feedback_play_id: 9000

    sensor_timeout_sec: 1.0
    estop_timeout_sec: 0.50
    command_timeout_sec: 0.30
    publish_rate_hz: 10.0
    stop_heartbeat_sec: 0.20

    # Conservative envelope, lower than the documented slow gait (303) maxima.
    max_forward_mps: 0.25
    max_lateral_mps: 0.10
    max_yaw_rps: 0.40
    max_forward_accel_mps2: 0.40
    max_lateral_accel_mps2: 0.30
    max_yaw_accel_rps2: 0.80
    front_stop_distance_m: 0.35
    front_slow_distance_m: 0.70
    front_half_angle_rad: 0.45
    max_tilt_rad: 0.60
    step_height_m: 0.05
